name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      # Scripts are skipped since the tests need only the packages, among
      # them @babel/parser to parse App.js and src.
      - name: Install
        working-directory: mobile-app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run node --test
        working-directory: mobile-app
        run: npm test
